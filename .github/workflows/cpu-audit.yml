name: CPU safety audit checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-aggregate.txt
      - run: pip install -r requirements-aggregate.txt
      - run: python -m unittest discover -s tests -v
      - name: Reproduce archived threshold-selection sensitivity
        run: >-
          python threshold_selection_sensitivity.py --repo .
          --out /tmp/threshold-subsets-check
          --check results/threshold-subsets-20261120/results.json
